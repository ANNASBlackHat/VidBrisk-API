[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-generation-pipeline"
version = "0.1.0"
description = "End-to-End Video Generation Pipeline from Raw Script to MP4"
readme = "SPEC.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "google-genai>=0.1.1",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "sqlalchemy>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
]
tts = [
    "kokoro-onnx>=0.5.0",
    "supertonic>=1.0.0",
    "soundfile>=0.12.1",
]
alignment = [
    # easytranscriber or whisperx
]
render = [
    "moviepy>=1.0.3,<2.0.0",
    "pillow>=10.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
