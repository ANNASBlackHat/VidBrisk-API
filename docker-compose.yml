services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-generation-pipeline:latest
    container_name: video-generation-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: ["python", "server.py", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  frontend:
    build:
      context: ../video-generation-frontend
      dockerfile: Dockerfile
    image: video-generation-frontend:latest
    container_name: video-generation-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
