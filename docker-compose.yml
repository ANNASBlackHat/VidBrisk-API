services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-generation-pipeline:latest
    container_name: video-generation-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - ./data:/app/data
      - ./models:/app/models
    command: ["python", "server.py", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  # Optional dedicated worker service if splitting API and worker containers
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-generation-pipeline:latest
    container_name: video-generation-worker
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - ./data:/app/data
      - ./models:/app/models
    command: ["python", "server.py", "--worker-only", "--interval", "1.0"]
    restart: unless-stopped
