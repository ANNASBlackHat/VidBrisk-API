<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VidBrisk Eval Contact Sheet — bench_mode_a</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    h1 { margin: 0; font-size: 24px; color: #38bdf8; }
    .meta { color: #94a3b8; font-size: 14px; }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      background: #1e293b;
      padding: 12px 16px;
      border-radius: 8px;
    }
    .controls select, .controls input {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 6px;
    }
    .summary-card {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-box {
      background: #1e293b;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-value { font-size: 20px; font-weight: bold; color: #38bdf8; }
    .stat-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; }

    .beat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      margin-bottom: 16px;
      padding: 16px;
      display: grid;
      grid-template-columns: 280px 1fr 1fr;
      gap: 20px;
    }
    .beat-card.static-flag { border-left: 4px solid #f59e0b; }
    .beat-card.repeat-flag { border-left: 4px solid #ef4444; }
    .beat-card.low-sim { border-left: 4px solid #ec4899; }

    .beat-info { display: flex; flex-direction: column; gap: 8px; }
    .beat-id { font-size: 12px; font-weight: bold; color: #38bdf8; text-transform: uppercase; }
    .vo-text { font-size: 14px; font-weight: 500; line-height: 1.4; }
    .visual-intent { font-size: 12px; color: #94a3b8; font-style: italic; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chip {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      background: #334155;
      color: #cbd5e1;
    }
    .chip.warn { background: #78350f; color: #fde68a; }
    .chip.alert { background: #7f1d1d; color: #fecaca; }
    .chip.good { background: #064e3b; color: #a7f3d0; }

    .video-preview {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .video-title { font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; }
    video, .img-preview {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 6px;
      background: #000;
    }
    .clip-meta { font-size: 11px; color: #64748b; }

    .candidates-list {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .cand-thumb {
      width: 80px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #475569;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>VidBrisk Eval Contact Sheet — bench_mode_a</h1>
      <div class="meta">Mode: A | Beats: original | Commit: f2efe70a | Generated: 20261010-0925</div>
    </div>
  </header>

  <div class="summary-card">
    <div class="stat-box"><div class="stat-value">0</div><div class="stat-label">Total Beats</div></div>
    <div class="stat-box"><div class="stat-value">0.0</div><div class="stat-label">Mean Sim</div></div>
    <div class="stat-box"><div class="stat-value">0.0%</div><div class="stat-label">Hit@1</div></div>
    <div class="stat-box"><div class="stat-value">0.0 / 5</div><div class="stat-label">Judge Relevance</div></div>
    <div class="stat-box"><div class="stat-value">0.0%</div><div class="stat-label">Static Rate</div></div>
    <div class="stat-box"><div class="stat-value">0.0%</div><div class="stat-label">Repeat Rate</div></div>
  </div>

  <div class="controls">
    <label>Filter Case:
      <select id="caseFilter" onchange="filterBeats()">
        <option value="all">All Cases</option>
        
      </select>
    </label>
    <label>Filter Flag:
      <select id="flagFilter" onchange="filterBeats()">
        <option value="all">All Beats</option>
        <option value="static">Static / Low Motion</option>
        <option value="repeat">Repeated</option>
        <option value="low_score">Low Similarity Score (&lt;0.5)</option>
      </select>
    </label>
  </div>

  <div id="beatsContainer">
    
  </div>

  <script>
    function filterBeats() {
      const c = document.getElementById("caseFilter").value;
      const f = document.getElementById("flagFilter").value;
      const cards = document.querySelectorAll(".beat-card");

      cards.forEach(card => {
        const cardCase = card.getAttribute("data-case");
        const isStatic = card.getAttribute("data-static") === "true";
        const isRepeat = card.getAttribute("data-repeat") === "true";
        const isLowScore = card.getAttribute("data-low-score") === "true";

        let caseMatch = (c === "all" || cardCase === c);
        let flagMatch = true;
        if (f === "static") flagMatch = isStatic;
        if (f === "repeat") flagMatch = isRepeat;
        if (f === "low_score") flagMatch = isLowScore;

        if (caseMatch && flagMatch) {
          card.style.display = "grid";
        } else {
          card.style.display = "none";
        }
      });
    }
  </script>
</body>
</html>
